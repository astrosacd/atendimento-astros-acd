version: "3.7"

services:
  astros_log_monitor:
    image: docker:latest
    container_name: astros_log_monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - AstrosNet
    deploy:
      placement:
        constraints: [node.role == manager]
    restart: always
    entrypoint:
      - "sh"
      - "-c"
      - |
        apk add --no-cache curl grep ssmtp jq
        
        USER_EMAIL="astroscomunicacaodigital@gmail.com"
        APP_PASSWORD="ozydfkgouorjrcjw"
        DESTINO="eudezioj@gmail.com"
        INTERVALO_ALERTA=1800
        IA_API_KEY="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"
        IA_MODEL="llama-3.3-70b-versatile"

        printf "root=%s\nmailhub=smtp.gmail.com:587\nAuthUser=%s\nAuthPass=%s\nUseSTARTTLS=YES\nhostname=astros_monitor\n" "$USER_EMAIL" "$USER_EMAIL" "$APP_PASSWORD" > /etc/ssmtp/ssmtp.conf

        echo "------------------------------------------"
        echo "MONITOR ATIVADO - LENDO CONTAINERS REAIS"
        echo "------------------------------------------"
        
        while true; do
          # Captura IDs de todos os containers rodando neste node
          CONTAINERS=`docker ps --format "{{.ID}}|{{.Names}}"`
          
          for row in $CONTAINERS; do
            ID=`echo $row | cut -d'|' -f1`
            NAME=`echo $row | cut -d'|' -f2`
            
            if [ "$NAME" = "astros_log_monitor" ]; then continue; fi
            
            # echo "Analisando logs de: $NAME"
            
            # Captura os ultimos 50 logs do container
            LOGS=`docker logs --since 2m --tail 50 $ID 2>&1`
            
            # Filtro agressivo de erros
            HAS_ERROR=`echo "$LOGS" | grep -iE "error|crit|fail|exception|fatal|panic|refused|timeout|abort|err_|warn" || echo ""`
            
            if [ -n "$HAS_ERROR" ]; then
               NOW=`date +%s`
               CLEAN_NAME=`echo "$NAME" | tr -dc '[:alnum:]'`
               LAST_FILE="/tmp/last_$CLEAN_NAME"
               
               if [ -f "$LAST_FILE" ]; then LAST_TIME=`cat "$LAST_FILE"`; else LAST_TIME=0; fi
               
               DIFF=`expr $NOW - $LAST_TIME`
               
               if [ "$DIFF" -gt "$INTERVALO_ALERTA" ]; then
                  echo "!!! ERRO NO CONTAINER: $NAME !!!"
                  
                  # Mandar log real para a IA
                  JSON_PROMPT=`echo "Container: $NAME. Logs: $LOGS" | jq -aRs .`

                  IA_RES=`curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
                    -H "Authorization: Bearer $IA_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d "{\"model\": \"$IA_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": $JSON_PROMPT}]}"`
                  
                  IA_EXPLICACAO=`echo "$IA_RES" | jq -r ".choices[0].message.content" | tr -d "\""`
                  
                  if [ "$IA_EXPLICACAO" = "null" ] || [ -z "$IA_EXPLICACAO" ]; then
                    IA_EXPLICACAO="Erro detectado nos logs do container $NAME."
                  fi

                  MSG="🚨 *CONTAINER:* $NAME\n\n*IA:* $IA_EXPLICACAO"
                  
                  # WhatsApp
                  curl -s -X POST "https://apievo.astroscomunicacaodigital.com/message/sendText/Astros_Comunicacao_Digital" \
                    -H "apikey: 4C1E13A72DCC-4542-A5C2-556EB2822A06" \
                    -H "Content-Type: application/json" \
                    -d "{\"number\": \"558596068965\", \"text\": \"$MSG\"}"
                  
                  # E-mail
                  printf "To: %s\nSubject: ERRO NO CONTAINER - %s\n\n%s" "$DESTINO" "$NAME" "$IA_EXPLICACAO" | ssmtp "$DESTINO"
                  
                  echo "$NOW" > "$LAST_FILE"
                  echo "Alerta enviado para $NAME"
               fi
            fi
          done
          sleep 30
        done

networks:
  AstrosNet:
    external: true
