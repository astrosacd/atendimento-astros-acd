version: "3.7"

services:
  astros_log_monitor:
    image: docker:latest
    container_name: astros_log_monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - AstrosNet
    deploy:
      placement:
        constraints: [node.role == manager]
    restart: always
    environment:
      - USER_EMAIL=astroscomunicacaodigital@gmail.com
      - APP_PASSWORD=ozydfkgouorjrcjw
      - DESTINO=eudezioj@gmail.com
      - IA_API_KEY=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
      - IA_MODEL=llama-3.3-70b-versatile
      - INTERVALO_ALERTA=1800
    entrypoint:
      - "sh"
      - "-c"
      - |
        apk add --no-cache curl jq grep ssmtp > /dev/null 2>&1
        printf "root=%s\nmailhub=smtp.gmail.com:587\nAuthUser=%s\nAuthPass=%s\nUseSTARTTLS=YES\nhostname=astros_monitor\n" "$USER_EMAIL" "$USER_EMAIL" "$APP_PASSWORD" > /etc/ssmtp/ssmtp.conf

        echo "------------------------------------------"
        echo "MONITOR ATIVADO - LENDO LOGS DOS CONTAINERS"
        echo "------------------------------------------"
        
        while true; do
          # Obtem apenas os IDs para evitar problemas de parsing no loop
          LISTA_IDS=`docker ps -q`
          
          for id in $LISTA_IDS; do
            if [ -z "$id" ]; then continue; fi
            
            # Pega o nome do container
            name=`docker inspect --format '{{.Name}}' "$id" | tr -d '/'`
            
            # Ignora o próprio monitor para não entrar em loop de log
            if [ "$name" = "astros_log_monitor" ]; then continue; fi
            
            # Verifica se existem logs de erro nos últimos 2 minutos
            logs=`docker logs --since 2m --tail 50 "$id" 2>&1`
            
            if [ -n "$logs" ]; then
               # Procura por palavras-chave de erro
               has_err=`echo "$logs" | grep -iE "error|crit|fail|exception|fatal|panic|refused|timeout|abort|err_|warn" | head -n 1`
               
               if [ -n "$has_err" ]; then
                  now=`date +%s`
                  # Nome limpo para o arquivo de trava (throttle)
                  clean_name=`echo "$name" | tr -dc '[:alnum:]'`
                  last_file="/tmp/last_$clean_name"
                  
                  if [ -f "$last_file" ]; then last_time=`cat "$last_file"`; else last_time=0; fi
                  
                  diff=`expr $now - $last_time`
                  
                  # Só envia alerta se passou o intervalo definido (ex: 30 min)
                  if [ "$diff" -gt "$INTERVALO_ALERTA" ]; then
                     echo "ERRO DETECTADO EM: $name"
                     
                     # Prepara os logs para a IA (limitando tamanho)
                     json_logs=`echo "$logs" | tail -n 20 | jq -aRs .`
                     
                     # Chama a IA para explicar o erro
                     ia_res=`curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
                       -H "Authorization: Bearer $IA_API_KEY" \
                       -H "Content-Type: application/json" \
                       -d "{\"model\": \"$IA_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Explique este erro do container $name de forma muito curta em portugues: $json_logs\"}]}"`
                     
                     expl=`echo "$ia_res" | jq -r ".choices[0].message.content" 2>/dev/null`
                     if [ -z "$expl" ] || [ "$expl" = "null" ]; then
                        expl="Erro detectado no container $name. Verifique os logs."
                     fi

                     msg="🚨 *ALERTA ASTROS*\n\n*Container:* $name\n*Análise:* $expl"
                     
                     # Envia para o WhatsApp
                     curl -s -X POST "https://apievo.astroscomunicacaodigital.com/message/sendText/Astros_Comunicacao_Digital" \
                       -H "apikey: 4C1E13A72DCC-4542-A5C2-556EB2822A06" \
                       -H "Content-Type: application/json" \
                       -d "{\"number\": \"558596068965\", \"text\": \"$msg\"}" > /dev/null
                     
                     # Envia por E-mail
                     printf "To: %s\nSubject: ALERTA DE ERRO: %s\n\n%s" "$DESTINO" "$name" "$expl" | ssmtp "$DESTINO"
                     
                     echo "$now" > "$last_file"
                     echo "Notificação enviada para $name"
                  fi
               fi
            fi
          done
          sleep 60
        done

networks:
  AstrosNet:
    external: true
